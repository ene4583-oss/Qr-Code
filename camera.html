<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer">
<title>Take face photo</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#10221e;color:white;font:16px/1.5 system-ui,sans-serif}main{height:100dvh;min-height:400px;position:relative;display:flex;flex-direction:column;overflow:hidden}video{width:100%;height:100%;position:absolute;inset:0;object-fit:contain;background:#10221e}header{z-index:1;padding:calc(16px + env(safe-area-inset-top)) 20px 16px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(#0008,transparent)}h1{font-size:18px;margin:0}button{cursor:pointer;border:0;border-radius:50%;color:white;background:#ffffff24;display:flex;align-items:center;justify-content:center;width:48px;height:48px}button:focus-visible{outline:3px solid #79dab4;outline-offset:4px}button:disabled{opacity:.4;cursor:default}.bottom{position:relative;z-index:1;margin-top:auto;padding:20px 24px calc(22px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#000a)}#status{text-align:center;max-width:550px;margin:0 auto 18px;font-size:14px;min-height:24px}.controls{display:flex;align-items:center;justify-content:center;gap:44px}#cameraShutter{width:78px;height:78px;background:white;box-shadow:0 0 0 4px #fff6,0 0 0 7px #10221e;border:5px solid #10221e}#retryCamera{border-radius:10px;width:auto;padding:10px 20px;margin:10px auto 0;background:#176653}.hidden{display:none!important}svg{width:26px;height:26px}.spacer{width:48px;height:48px}@media(min-width:900px){video{object-fit:contain}main{max-width:900px;margin:auto}}
</style></head>
<body><main><video id="cameraVideo" autoplay muted playsinline></video><header><h1>Take a face photo</h1><button id="closeCamera" type="button" aria-label="Close camera">×</button></header><div class="bottom"><p id="status" role="status">Opening camera…</p><div class="controls"><div class="spacer"></div><button id="cameraShutter" type="button" aria-label="Take photo" disabled></button><button id="flipCamera" type="button" aria-label="Switch front or rear camera" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 8a8 8 0 0 1 14-3l2 2M20 3v4h-4M20 16A8 8 0 0 1 6 21l-2-2M4 23v-4h4"/></svg></button></div><button id="retryCamera" class="hidden" type="button">Try camera again</button></div></main>
<script>
'use strict';
const params=new URLSearchParams(location.hash.slice(1)),requestNonce=params.get('request')||'',returnOrigin=params.get('parent')||'',video=document.getElementById('cameraVideo'),statusBox=document.getElementById('status'),shutter=document.getElementById('cameraShutter'),flip=document.getElementById('flipCamera'),retry=document.getElementById('retryCamera');
let stream=null,generation=0,facing='user',sent=false;
function allowedParent(origin){try{const u=new URL(origin);return u.origin===origin&&((u.protocol==='https:'&&(u.hostname==='script.google.com'||u.hostname==='script.googleusercontent.com'||u.hostname.endsWith('-script.googleusercontent.com')||u.hostname==='ene4583-oss.github.io'))||((u.hostname==='127.0.0.1'||u.hostname==='localhost')&&u.protocol==='http:'));}catch(e){return false;}}
function stop(){generation++;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;video.srcObject=null;shutter.disabled=true;flip.disabled=true;}
function fail(error){const policy=document.permissionsPolicy||document.featurePolicy;if(policy&&policy.allowsFeature&&!policy.allowsFeature('camera'))return 'This page cannot use the camera. Open the camera page directly in Chrome or Safari.';if(error.name==='NotFoundError')return 'No camera found. Use a phone or connect a webcam.';if(error.name==='NotReadableError')return 'Camera is busy. Close other camera apps and try again.';if(error.name==='NotAllowedError'||error.name==='SecurityError')return 'Allow camera access in Chrome (Android) or Safari (iPhone). If opened inside another app, open this page in the full browser.';return 'Camera unavailable ('+(error.name||'unknown')+'). Try a supported browser over HTTPS.';}
async function start(){stop();sent=false;const version=generation;retry.classList.add('hidden');statusBox.textContent='Opening camera…';try{if(!window.isSecureContext||!navigator.mediaDevices?.getUserMedia)throw new DOMException('Secure camera access required','SecurityError');const next=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing},width:{ideal:1280},height:{ideal:960}},audio:false});if(version!==generation){next.getTracks().forEach(t=>t.stop());return;}stream=next;video.srcObject=next;await video.play();if(version!==generation)return;shutter.disabled=false;flip.disabled=false;statusBox.textContent='Keep the employee or your face visible. Tap the white button to take the photo.';}catch(error){if(version!==generation)return;stop();statusBox.textContent=fail(error);retry.classList.remove('hidden');}}
function capture(){if(!stream||!video.videoWidth||sent)return;const canvas=document.createElement('canvas'),scale=Math.min(1,1280/Math.max(video.videoWidth,video.videoHeight));canvas.width=Math.round(video.videoWidth*scale);canvas.height=Math.round(video.videoHeight*scale);canvas.getContext('2d').drawImage(video,0,0,canvas.width,canvas.height);const photo=canvas.toDataURL('image/jpeg',.8);if(photo.length>2700000){statusBox.textContent='Photo is too large. Please retake it.';return;}sent=true;stop();statusBox.textContent='Sending photo to the inventory form…';window.opener.postMessage({type:'stockflow.face.capture',request:requestNonce,photo:photo,capturedAt:new Date().toISOString()},returnOrigin);setTimeout(()=>{if(sent)statusBox.textContent='If the photo has not appeared, return to the inventory tab and reopen the camera. Keep both tabs in the same browser.';},5000);}
window.addEventListener('message',event=>{if(event.source!==window.opener||event.origin!==returnOrigin||event.data?.request!==requestNonce||event.data?.type!=='stockflow.face.accepted')return;statusBox.textContent='Photo added. Return to the inventory form.';window.close();});
flip.onclick=()=>{facing=facing==='user'?'environment':'user';start();};shutter.onclick=capture;retry.onclick=start;document.getElementById('closeCamera').onclick=()=>{stop();window.close();};window.addEventListener('pagehide',stop);document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();else if(!sent&&window.opener&&allowedParent(returnOrigin)&&requestNonce)start();});
if(!window.opener||!allowedParent(returnOrigin)||!requestNonce||requestNonce.length>100){statusBox.textContent='Open this camera from Upload face photo in the inventory website.';retry.classList.add('hidden');}else start();
</script></body></html>
